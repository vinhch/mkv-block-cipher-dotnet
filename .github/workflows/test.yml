name: test
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # A failing leg must not hide the results of the others.
      fail-fast: false
      matrix:
        # Each x64 leg turns one instruction-set path off, so its fallback runs in CI.
        # On a GFNI host, AVX2 off alone keeps Gfni.V256 on, so the S-layer skips the split-half lane shuffle.
        # Only no-AVX2-no-GFNI runs it. Its dotnet-env is two lines, one variable each: the step writes the
        # value to GITHUB_ENV as it is.
        include:
          - { os: ubuntu-latest, leg: default, dotnet-env: "" }
          - { os: ubuntu-latest, leg: no-hwintrinsic, dotnet-env: DOTNET_EnableHWIntrinsic=0 }
          - { os: ubuntu-latest, leg: no-gfni, dotnet-env: DOTNET_EnableGFNI=0 }
          - { os: ubuntu-latest, leg: no-avx2, dotnet-env: DOTNET_EnableAVX2=0 }
          - { os: ubuntu-latest, leg: no-avx2-no-gfni, dotnet-env: "DOTNET_EnableAVX2=0\nDOTNET_EnableGFNI=0" }
          - { os: macos-latest, leg: arm64, dotnet-env: "" }
    name: test (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/repo-setup
      - name: Set the runtime switch for this leg
        if: matrix.dotnet-env != ''
        run: echo "${{ matrix.dotnet-env }}" >> "$GITHUB_ENV"
      # Without this, an arm64 leg scheduled on an x64 host would skip the ARM64 guard and go green.
      - name: Guard - the arm64 leg runs on an ARM64 host
        if: matrix.leg == 'arm64' && runner.arch != 'ARM64'
        run: |
          echo "The arm64 leg ran on ${{ runner.arch }}, so the ARM64 guard would be skipped"
          exit 1
      # AVX-512 is not selectable on GitHub-hosted runners: the pool mixes CPUs, and only some
      # of them support the AVX-512 engine. The probe and the tests share this job because a
      # separate detect job would land on a different VM with a different CPU.
      - name: Probe the runner for AVX-512
        if: matrix.leg == 'default' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          # Overridable so the block can be run against a fixture off-host.
          cpuinfo=${CPUINFO:-/proc/cpuinfo}
          flags=$(awk -F': ' '/^flags/ { print $2; exit }' "$cpuinfo")
          model=$(awk -F': ' '/^model name/ { print $2; exit }' "$cpuinfo")
          has() { case " $flags " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          # The six flags Vector512.IsHardwareAccelerated and Gfni.V512 need. A hypervisor can
          # mask CD, DQ or VL while leaving gfni visible, so checking the AVX-512 group alone
          # would claim eligibility the runtime does not agree with.
          if has avx512f && has avx512bw && has avx512cd && has avx512dq && has avx512vl && has gfni; then
            vbmi=0
            if has avx512vbmi; then vbmi=1; fi
            printf 'MKV_EXPECT_ENGINE=X64Avx512Engine\nMKV_EXPECT_VBMI=%s\n' "$vbmi" >> "$GITHUB_ENV"
            echo "::notice::CPU $model supports the AVX-512 engine (AVX-512F, BW, CD, DQ, VL and GFNI); its guard tests run."
            echo "AVX-512 engine: eligible, $model" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MKV_EXPECT_ENGINE=X64Engine" >> "$GITHUB_ENV"
            echo "::notice::CPU $model does not support the AVX-512 engine, which needs AVX-512F, BW, CD, DQ, VL and GFNI; this run does not cover it."
            echo "AVX-512 engine: not eligible, $model" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test
        run: bash scripts/test.sh Release --report-github
      # The probe's MKV_EXPECT_ENGINE must actually reach an assertion. A skipped probe would
      # leave every guard test skipped and the leg green, so this reruns the class and reads
      # the TRX for the one test that proves the expectation was checked.
      - name: Guard - the AVX-512 probe expectation was asserted
        if: matrix.leg == 'default' && runner.arch == 'X64'
        run: |
          set -euo pipefail
          trx=artifacts/avx512/avx512-guards.trx
          mkdir -p artifacts/avx512
          dotnet run -c Release --no-build --project tests/MkvBlockCipher.Tests/MkvBlockCipher.Tests.csproj -- -class "*Avx512GuardTests" -result-trx "$trx"
          # The TRX writer puts every result on one line, so match the name and outcome together.
          if ! grep -q 'testName="[^"]*Factory_picks_expected_engine" [^>]*outcome="Passed"' "$trx"; then
            echo "Factory_picks_expected_engine did not run and pass; the probe's expectation was not asserted"
            exit 1
          fi
      # Arm64PrimitiveTests skip on every other host, so a green run there proves nothing.
      # On an ARM64 host every case must run and pass; anything else fails the leg.
      - name: Guard - ARM64 primitive tests all ran and passed
        if: runner.arch == 'ARM64'
        run: |
          set -euo pipefail
          trx=artifacts/arm64/arm64-primitives.trx
          mkdir -p artifacts/arm64
          dotnet run -c Release --no-build --project tests/MkvBlockCipher.Tests/MkvBlockCipher.Tests.csproj -- -class "*Arm64PrimitiveTests" -result-trx "$trx"
          # Count occurrences, not lines: the TRX writer puts every result on one line.
          total=$(grep -o '<UnitTestResult ' "$trx" | wc -l | tr -d ' ' || true)
          passed=$(grep -o 'outcome="Passed"' "$trx" | wc -l | tr -d ' ' || true)
          # The floor catches cases that were not discovered: a smaller run would still pass every case it found.
          min_tests=3
          if (( total < min_tests || passed != total )); then
            echo "ARM64 primitive tests: expected at least $min_tests, ran $total, passed $passed; every case must run on an ARM64 host"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/repo-setup
      # The script owns the report-count guard, so a local run gets the same check.
      - name: Test + coverage report
        run: bash scripts/coverage.sh Release --report-github
      - name: Coverage summary
        run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: artifacts/coverage/report

  aot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/repo-setup
      # Native AOT links through clang and needs zlib on Linux.
      - name: Install the native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: AOT smoke
        run: bash scripts/aot-smoke.sh
